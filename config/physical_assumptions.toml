route_name = "USGC (Sabine Pass) to NEA (Futtsu Tokyo Bay) via Panama Canal"
distance_laden_nm = 9950.0
distance_ballast_nm = 9950.0
canal_transit_days_laden = 1.50
canal_transit_days_ballast = 1.50
weather_port_buffer_days_laden = 1.00
weather_port_buffer_days_ballast = 0.75
