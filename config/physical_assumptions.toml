route_name = "USGC (Sabine Pass) to NEA (Futtsu Tokyo Bay) via Cape of Good Hope"
distance_laden_nm = 15600.0
distance_ballast_nm = 15600.0
canal_transit_days_laden = 0.0
canal_transit_days_ballast = 0.0
weather_port_buffer_days_laden = 1.50
